<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#031c15">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>CoopSync</title>

  <!-- ফন্ট পেছনে লোড হয়, স্প্ল্যাশ আঁকা আটকায় না -->
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,600;6..72,700&family=Hind+Siliguri:wght@500;600&family=Noto+Serif+Bengali:wght@700&display=swap">

  <style>
    :root{
      --g:#0a4234; --gd:#052a20; --gk:#031c15;
      --gold:#b08d3c; --gold-b:#c6a24d; --gold-l:#efe4c6;
    }
    *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body{ width:100%; height:100%; overflow:hidden; background:var(--gk);
      font-family:'Hind Siliguri','Noto Serif Bengali',system-ui,-apple-system,'Segoe UI',sans-serif; }

    /* ── App iframe ── */
    #app-frame{ position:fixed; top:0; left:0; width:100vw; height:100vh; height:100dvh; border:none; display:block; background:#fff; opacity:0; transition:opacity .35s ease; }
    #app-frame.visible{ opacity:1; }

    /* ── Splash ── */
    #loader{
      position:fixed; inset:0; z-index:9999;
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0; text-align:center;
      padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      background:
        radial-gradient(ellipse 55% 50% at 85% 0%, rgba(176,141,60,.22), transparent 70%),
        radial-gradient(ellipse 60% 55% at 50% 38%, var(--g) 0%, var(--gd) 55%, var(--gk) 100%);
    }
    #loader::before{
      content:''; position:absolute; inset:0; pointer-events:none;
      background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
      background-size:56px 56px;
      -webkit-mask-image:linear-gradient(180deg,#000 30%,transparent 100%); mask-image:linear-gradient(180deg,#000 30%,transparent 100%);
    }
    #loader::after{
      content:''; position:absolute; left:0; right:0; bottom:0; height:3px; pointer-events:none;
      background:linear-gradient(90deg,transparent,var(--gold) 30%,var(--gold) 70%,transparent);
    }
    #loader.hide{ opacity:0; visibility:hidden; pointer-events:none; transition:opacity .5s ease, visibility .5s; }
    #loader > *{ position:relative; z-index:1; }

    .logo-wrapper{ width:100px; height:100px; position:relative; display:flex; justify-content:center; align-items:center; }
    .logo-ring{ position:absolute; inset:0; border-radius:50%; border:2px solid rgba(239,228,198,.16); border-top-color:var(--gold-b); animation:spin 1.15s linear infinite; }
    .logo-ring::after{ content:''; position:absolute; inset:9px; border-radius:50%; border:1px dashed rgba(239,228,198,.35); animation:spin 6s linear infinite reverse; }
    .logo-core{ width:50px; height:50px; border-radius:10px; display:flex; justify-content:center; align-items:center; font-size:26px; color:var(--gold-l);
      background:var(--gd); box-shadow:inset 0 0 0 1px var(--gold), 0 0 28px rgba(176,141,60,.35); animation:pulse 1.8s ease-in-out infinite; }
    @keyframes spin{ to{ transform:rotate(360deg); } }
    @keyframes pulse{ 50%{ transform:scale(1.08); } }

    .loader-title{ margin-top:28px; color:#fff; font-family:'Newsreader','Noto Serif Bengali',serif; font-size:24px; font-weight:700; letter-spacing:.005em; }
    .loader-sub{ margin-top:2px; color:rgba(239,228,198,.7); font-size:13px; font-weight:500; }

    .progress-bar{ margin-top:20px; width:180px; height:2px; overflow:hidden; border-radius:2px; background:rgba(239,228,198,.15); }
    .progress-bar span{ display:block; height:100%; width:40%; background:linear-gradient(90deg,transparent,var(--gold-b),transparent); animation:loading 1.3s ease-in-out infinite; }
    @keyframes loading{ from{ transform:translateX(-120%); } to{ transform:translateX(320%); } }

    .loader-status{ margin-top:16px; color:rgba(255,255,255,.65); font-size:13px; min-height:20px; max-width:280px; }

    .retry-btn{ display:none; margin-top:18px; padding:11px 26px; border:none; border-radius:6px; cursor:pointer;
      font-family:inherit; font-size:14px; font-weight:600; color:#1f1704;
      background:linear-gradient(180deg,#c6a24d,var(--gold)); box-shadow:0 8px 22px rgba(176,141,60,.38); }
    .retry-btn:hover{ background:linear-gradient(180deg,#d4b05a,#bd9a45); }
    .retry-btn.show{ display:block; }
    .retry-btn:focus-visible{ outline:2px solid var(--gold-l); outline-offset:3px; }

    @media (prefers-reduced-motion:reduce){
      .logo-ring,.logo-ring::after,.progress-bar span{ animation:none; }
      .logo-core{ animation:pulse 2.4s ease-in-out infinite; }
    }
  </style>
</head>

<body>

  <div id="loader" role="status" aria-live="polite">
    <div class="logo-wrapper">
      <div class="logo-ring"></div>
      <div class="logo-core">☘</div>
    </div>
    <div class="loader-title">CoopSync</div>
    <div class="loader-sub">শুরু হচ্ছে… · Starting</div>
    <div class="progress-bar"><span></span></div>
    <div class="loader-status" id="loaderStatus">সংযোগ স্থাপন করা হচ্ছে…</div>
    <button class="retry-btn" id="retryBtn">আবার চেষ্টা করুন · Try again</button>
  </div>

  <iframe id="app-frame"
          src="https://script.google.com/macros/s/AKfycbzYC_QXxq1AjK1wx2trZwXm-I5_j-KgBZghjppH9FX5rN2Cjlh090tXmWIh8YpdtWcv/exec"
          title="CoopSync Application" allow="clipboard-write"></iframe>

  <script>
    const frame = document.getElementById("app-frame");
    const loader = document.getElementById("loader");
    const statusText = document.getElementById("loaderStatus");
    const retryButton = document.getElementById("retryBtn");

    let isLoaded = false;
    let messageTimer = null;
    let slowTimer = null;

    /* এই বার্তাগুলো শুধু ব্যবহারকারীর অভিজ্ঞতার জন্য; আসল অগ্রগতি নয় */
    const messages = [
      "সংযোগ স্থাপন করা হচ্ছে…",
      "অ্যাপ প্রস্তুত করা হচ্ছে…",
      "প্রয়োজনীয় ফাইল লোড হচ্ছে…",
      "প্রায় হয়ে গেছে…"
    ];

    function startTimers() {
      let i = 0;
      clearInterval(messageTimer);
      clearTimeout(slowTimer);

      messageTimer = setInterval(() => {
        if (isLoaded) return;
        i = (i + 1) % messages.length;
        statusText.textContent = messages[i];
      }, 1800);

      /* ২০ সেকেন্ডের বেশি লাগলে ধীর সংযোগের বার্তা ও পুনরায় চেষ্টার বোতাম */
      slowTimer = setTimeout(() => {
        if (!isLoaded) {
          statusText.textContent = "সংযোগ কিছুটা ধীর মনে হচ্ছে…";
          retryButton.classList.add("show");
        }
      }, 20000);
    }

    /* আসল লোড ইভেন্ট: iframe লোড হওয়ার সাথে সাথেই অ্যাপ দেখানো হয় */
    frame.addEventListener("load", () => {
      isLoaded = true;
      clearTimeout(slowTimer);
      clearInterval(messageTimer);
      frame.classList.add("visible");
      loader.classList.add("hide");
    });

    /* পুনরায় চেষ্টা: স্প্ল্যাশ আবার দেখিয়ে ক্যাশ এড়িয়ে লোড করা হয় */
    retryButton.addEventListener("click", () => {
      isLoaded = false;
      retryButton.classList.remove("show");
      statusText.textContent = "আবার সংযোগ করা হচ্ছে…";
      frame.classList.remove("visible");
      loader.classList.remove("hide");

      const newURL = new URL(frame.src);
      newURL.searchParams.set("refresh", Date.now());
      frame.src = newURL.toString();
      startTimers();
    });

    /* অরিয়েন্টেশন বদলালে উচ্চতা ঠিক রাখা */
    window.addEventListener("resize", () => {
      frame.style.height = window.innerHeight + "px";
    });

    startTimers();
  </script>

</body>
</html>

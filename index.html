<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">


    <meta name="theme-color" content="#020617">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <meta name="mobile-web-app-capable" content="yes">


    <title>CoopSync</title>


    <style>
        /* ===========================
           GLOBAL RESET
        =========================== */
        
        
        *{
        
            margin:0;
            padding:0;
            box-sizing:border-box;
        
            -webkit-tap-highlight-color:transparent;
        
        }
        
        
        
        html,
        body{
        
            width:100%;
            height:100%;
        
            overflow:hidden;
        
            background:#020617;
        
            font-family:
            "Segoe UI",
            system-ui,
            -apple-system,
            sans-serif;
        
        }
        
        
        
        /* ===========================
           APP IFRAME
        =========================== */
        
        
        #app-frame{
        
        
            position:fixed;
        
        
            top:0;
            left:0;
        
        
            width:100vw;
        
        
            height:100vh;
        
            height:100dvh;
        
        
            border:none;
        
        
            display:block;
        
        
            background:white;
        
        
            opacity:0;
        
        
        }
        
        
        
        #app-frame.visible{
        
        
            opacity:1;
        
        
        }
        
        
        
        /* ===========================
           SPLASH SCREEN
        =========================== */
        
        
        #loader{
        
        
            position:fixed;
        
        
            inset:0;
        
        
            z-index:9999;
        
        
            display:flex;
        
        
            flex-direction:column;
        
        
            align-items:center;
        
        
            justify-content:center;
        
        
            gap:26px;
        
        
        
            padding:
        
            env(safe-area-inset-top)
        
            env(safe-area-inset-right)
        
            env(safe-area-inset-bottom)
        
            env(safe-area-inset-left);
        
        
        
            background:
        
        
            radial-gradient(
        
                circle at 50% 30%,
        
                #1e3a8a 0%,
        
                #020617 70%
        
            );
        
        
        
        }
        
        
        
        #loader.hide{
        
        
            display:none;
        
        
        }
        
        
        
        /* ===========================
           LOGO ANIMATION
        =========================== */
        
        
        .logo-wrapper{
        
        
            width:100px;
        
            height:100px;
        
        
            position:relative;
        
        
            display:flex;
        
        
            justify-content:center;
        
        
            align-items:center;
        
        
        }
        
        
        
        .logo-ring{
        
        
            position:absolute;
        
        
            inset:0;
        
        
            border-radius:50%;
        
        
            border:
        
            4px solid transparent;
        
        
            border-top-color:#38bdf8;
        
        
            border-right-color:#8b5cf6;
        
        
        
            animation:
        
            rotate 1.2s linear infinite;
        
        
        }
        
        
        
        .logo-ring::after{
        
        
            content:"";
        
        
            position:absolute;
        
        
            inset:-10px;
        
        
            border-radius:50%;
        
        
            border:
        
            1px solid rgba(255,255,255,.15);
        
        
        }
        
        
        
        .logo-core{
        
        
            width:50px;
        
        
            height:50px;
        
        
            border-radius:15px;
        
        
        
            display:flex;
        
        
            justify-content:center;
        
        
            align-items:center;
        
        
        
            color:white;
        
        
            font-size:20px;
        
        
            font-weight:700;
        
        
        
            background:
        
            linear-gradient(
        
                135deg,
        
                #38bdf8,
        
                #8b5cf6
        
            );
        
        
        
            box-shadow:
        
        
            0 0 35px rgba(56,189,248,.7);
        
        
        
            animation:
        
            pulse 1.5s ease infinite;
        
        
        }
        
        
        
        
        
        @keyframes rotate{
        
        
            to{
        
                transform:rotate(360deg);
        
            }
        
        }
        
        
        
        @keyframes pulse{
        
        
            50%{
        
                transform:scale(1.1);
        
            }
        
        }
        
        
        
        /* ===========================
           TEXT
        =========================== */
        
        
        .loader-title{
        
        
            color:#f8fafc;
        
        
            font-size:18px;
        
        
            font-weight:600;
        
        
        }
        
        
        
        .loader-status{
        
        
            color:#94a3b8;
        
        
            font-size:13px;
        
        
            min-height:18px;
        
        
        }
        
        
        
        /* ===========================
           PROGRESS BAR
        =========================== */
        
        
        .progress-bar{
        
        
            width:220px;
        
        
            height:5px;
        
        
            overflow:hidden;
        
        
            border-radius:50px;
        
        
            background:
        
            rgba(255,255,255,.12);
        
        
        }
        
        
        
        .progress-bar span{
        
        
            display:block;
        
        
            height:100%;
        
        
            width:35%;
        
        
            border-radius:50px;
        
        
        
            background:
        
            linear-gradient(
        
                90deg,
        
                #38bdf8,
        
                #8b5cf6
        
            );
        
        
        
            animation:
        
            loading 1.3s infinite;
        
        
        }
        
        
        
        
        @keyframes loading{
        
        
            from{
        
                transform:translateX(-150%);
        
            }
        
        
            to{
        
                transform:translateX(350%);
        
            }
        
        
        }
        
        
        
        /* ===========================
           RETRY BUTTON
        =========================== */
        
        
        .retry-btn{
        
        
            display:none;
        
        
            padding:
        
            10px 24px;
        
        
            border:none;
        
        
            border-radius:50px;
        
        
            color:white;
        
        
            font-weight:600;
        
        
            background:
        
            linear-gradient(
        
                135deg,
        
                #38bdf8,
        
                #8b5cf6
        
            );
        
        
        }
        
        
        
        .retry-btn.show{
        
        
            display:block;
        
        
        }
    </style>

</head>


<body>


    <div id="loader">


        <div class="logo-wrapper">

            <div class="logo-ring"></div>

            <div class="logo-core">
                CS
            </div>

        </div>



        <div class="loader-title">
            Starting CoopSync
        </div>



        <div class="progress-bar">

            <span></span>

        </div>



        <div class="loader-status" id="loaderStatus">

            Establishing connection...

        </div>



        <button class="retry-btn" id="retryBtn">

            Try Again

        </button>



    </div>



    <iframe id="app-frame" src="https://script.google.com/macros/s/AKfycbzYC_QXxq1AjK1wx2trZwXm-I5_j-KgBZghjppH9FX5rN2Cjlh090tXmWIh8YpdtWcv/exec" title="CoopSync Application" allow="clipboard-write"></iframe>
    <script>
        const frame = document.getElementById("app-frame");
        
        const loader = document.getElementById("loader");
        
        const statusText = document.getElementById("loaderStatus");
        
        const retryButton = document.getElementById("retryBtn");
        
        
        
        let isLoaded = false;
        
        
        
        /*
            Dynamic loading messages.
            These do not represent fake progress.
            They only improve user experience.
        */
        
        
        const messages = [
        
            "Establishing connection...",
        
            "Preparing application...",
        
            "Loading resources...",
        
            "Almost ready..."
        
        ];
        
        
        let messageIndex = 0;
        
        
        
        const messageTimer = setInterval(()=>{
        
        
            if(!isLoaded){
        
        
                statusText.textContent =
                messages[messageIndex];
        
        
                messageIndex++;
        
        
                if(messageIndex >= messages.length){
        
                    messageIndex = 0;
        
                }
        
            }
        
        
        },1800);
        
        
        
        
        
        
        /*
            Slow connection detection.
        
            If loading takes too long,
            show retry option.
        */
        
        
        const slowTimer = setTimeout(()=>{
        
        
            if(!isLoaded){
        
        
                statusText.textContent =
                "Connection seems slow...";
        
        
                retryButton.classList.add("show");
        
        
            }
        
        
        },20000);
        
        
        
        
        
        
        
        /*
            REAL LOAD EVENT
        
            This is the important part.
        
            No fake delay.
            No animation waiting.
        
            The moment iframe finishes loading,
            app becomes visible instantly.
        */
        
        
        frame.addEventListener("load",()=>{
        
        
            isLoaded = true;
        
        
            clearTimeout(slowTimer);
        
            clearInterval(messageTimer);
        
        
        
            /*
                Show application immediately
            */
        
        
            frame.classList.add("visible");
        
        
        
            /*
                Remove splash immediately
            */
        
        
            loader.classList.add("hide");
        
        
        
        });
        
        
        
        
        
        
        
        
        /*
            Retry loading
        */
        
        
        retryButton.addEventListener("click",()=>{
        
        
            isLoaded = false;
        
        
            retryButton.classList.remove("show");
        
        
            statusText.textContent =
            "Reconnecting...";
        
        
        
            const newURL = new URL(frame.src);
        
        
            /*
                Cache bypass
            */
        
        
            newURL.searchParams.set(
                "refresh",
                Date.now()
            );
        
        
        
            frame.src =
            newURL.toString();
        
        
        
        });
        
        
        
        
        
        
        
        
        /*
            Prevent accidental app scaling issues
            when orientation changes.
        */
        
        
        window.addEventListener(
        "resize",
        ()=>{
        
        
            frame.style.height =
            window.innerHeight + "px";
        
        
        });
    </script>


</body>

</html>
